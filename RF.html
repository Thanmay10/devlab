<html><head><title>New Registration form</title></head>
<body>
<h2>New RF</h2>
<form id="regform">
Name:<input type="text" id="Name" required><br></br>
Email:<input type="email" id="Email" required><br></br>
Phone:<input type="text" id="Phone" required><br></br>
Gender:<select id="gender" required>
 <option value=" ">Select</option>
 <option>Male</option>
 <option>Female</option>
 <option>Other</option>
</select><br></br>
Event:<select id="Event" required>
 <option value=" ">Select</option>
 <option>Hachathon</option>
 <option>Nirvana</option>
 <option>Other</option>
</select><br></br>
<button type="submit">Register</button>
</form>
<p id="message"></p>
<script>
document.getElementById("regform").onsubmit=function(e){
 e.preventDefault();
 document.getElementById("message").innerText="Registration Successful";
};
</script>
</body></html>
